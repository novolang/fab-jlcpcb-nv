[package]
name        = "fab-package-nv"
version     = "0.1.0"
description = "Prepares and checks the order package of a KiCad revision for JLCPCB's assembly service: the Gerber and drill zip, the bill of materials in the columns JLCPCB's sample uses, the placement file with the rotation and origin corrections of the Fabrication Toolkit made visible in a report, a check of the package against the manufacturer's published capabilities, and a sheet for the person who orders on the web.  It places no order and calls no service."
license     = "Apache-2.0"

# `experimental` because no program outside this repository has used the
# package yet.
stability   = "experimental"

# `host`: the package reads a revision directory and writes the package
# beside it.
layer       = "host"

category    = "tooling"

tags        = ["jlcpcb", "fabrication", "gerber", "bill-of-materials", "placement", "cpl", "kicad", "assembly"]
repository  = "https://github.com/novolang/fab-package-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.26.1"

# A library: no `main`, so `novo pkg build` type-checks and
# effect-checks every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "Preparing and checking the JLCPCB order package of a KiCad revision"

[dependencies]
# Sibling paths while the three packages are unpublished: the registry has
# no release of them yet.  `novo pkg publish` refuses a path, so each line
# becomes a registry range (`^0.1.0`) once its package is uploaded.
hardware-gates-nv = { path = "../hardware-gates-nv" }
kicad-pcb-nv = { path = "../kicad-pcb-nv" }

# The dependencies of the two above, named here because a consumer of a
# path dependency lists the closure itself.
sexpr-nv = { path = "../sexpr-nv" }
stl-nv = { path = "../stl-nv" }
